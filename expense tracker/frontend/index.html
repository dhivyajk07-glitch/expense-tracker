<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💰 Expense Tracker</h1>
        <p>Manage your money smartly!</p>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0.00</p>
            </div>
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">₹0.00</p>
            </div>
            <div class="summary-card">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <label for="description">Description</label>
                <input id="description" type="text"
                    placeholder="e.g. Food, Salary" required>

                <label for="amount">Amount (₹)</label>
                <input id="amount" type="number"
                    min="0.01" step="0.01" placeholder="Enter amount" required>

                <label for="type">Transaction Type</label>
                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input id="date" type="date" required>

                <button type="submit" id="submitBtn">Add Transaction</button>
            </form>
        </section>

        <section class="transactions-section">
            <h2>Transaction History</h2>
            <input id="search" type="search"
                placeholder="Search transactions...">
            <div id="transactionsList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
